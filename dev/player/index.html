<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amble player harness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0c24; color: #f4ecdc; font: 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 960px 1fr; gap: 16px; padding: 16px; }
      #stage { width: 960px; height: 540px; background: #0f0c1e; border-radius: 10px; overflow: hidden; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
      button, select { background: #221b2e; color: #f4ecdc; border: 1px solid #4a4058; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: #86f3cb; }
      pre { background: #15122a; padding: 10px; border-radius: 8px; max-height: 520px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
      label { display: inline-flex; gap: 6px; align-items: center; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div id="stage"></div>
        <div class="bar">
          <select id="fixture"></select>
          <button id="play">▶ Play</button>
          <button id="pause">Pause</button>
          <button id="resume">Resume</button>
          <button id="restartLevel">Restart level</button>
          <button id="restart">Restart (fresh realm)</button>
          <button id="swap">Draw the hero</button>
          <button id="clear">Clear the hero</button>
          <button id="robot">Robot test</button>
          <button id="export">Export page</button>
          <button id="fullscreen">Full screen</button>
        </div>
        <div class="bar" id="dials"></div>
        <div class="bar" id="twists"></div>
      </section>
      <section>
        <pre id="stats">no game</pre>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
