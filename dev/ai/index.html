<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI plumbing harness</title>
    <style>
      :root { color-scheme: dark; --bg: #14121f; --panel: #1e1b2e; --ink: #ece8ff; --muted: #a9a3c7; --ok: #7ddf8c; --bad: #ff6b81; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
      main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 18px; }
      #summary { font-weight: 600; margin: 0 0 12px; }
      table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #2c2842; vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      td.status { font-weight: 700; width: 56px; }
      td.ok { color: var(--ok); }
      td.bad { color: var(--bad); }
      td.ms { color: var(--muted); width: 72px; font-variant-numeric: tabular-nums; }
      td.detail { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI plumbing harness</h1>
      <p class="sub">src/ai in a real browser against a scripted OpenAI-compatible endpoint on another origin.</p>
      <p id="summary">Running…</p>
      <table>
        <thead><tr><th>Result</th><th>Check</th><th>Time</th><th>Detail</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
